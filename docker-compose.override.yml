# Локальное переопределение поверх docker-compose.yml — Compose подхватывает
# этот файл автоматически и мержит поверх env_file: .env (environment: здесь
# имеет приоритет). Используется, чтобы включить исполнение сделок по
# подтверждению (этап 15.4, период сухого прогона) без правки .env: .env на
# сервере — единственный источник секретов, трогать его руками не хотим.
#
# Убрать/удалить этот файл — вернёт TRADING_EXECUTION_ENABLED к дефолту
# false из app/core/config.py.
services:
  bot:
    environment:
      TRADING_EXECUTION_ENABLED: "true"
