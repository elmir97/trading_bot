services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не публикуем: база доступна только внутри compose-сети.
    # Для локальной отладки раскомментировать.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: trading_bot_test_db
    restart: "no"
    # Отдельный профиль: не поднимается обычным `docker compose up`,
    # только явным `docker compose --profile test up -d postgres_test`.
    # Совсем другая база, а не prod — тесты создают и удаляют данные.
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: trading_bot_test
    # tmpfs вместо volume: данные заведомо не переживают остановку
    # контейнера — тестовой базе незачем накапливать состояние между
    # прогонами, а полный сброс избавляет от ручной очистки таблиц.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d trading_bot_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: trading_bot_redis
    restart: unless-stopped
    command: >-
      redis-server --appendonly no --save "" --maxmemory 256mb
      --maxmemory-policy noeviction
    # Порт наружу не публикуем: доступен только внутри compose-сети.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: trading_bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        # Не просто "запущен", а "принимает соединения" — иначе бот
        # падает на старте в гонке с инициализацией базы.
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
