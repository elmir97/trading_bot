<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Открыть сделку</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="vendor/lightweight-charts-5.2.1.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="account" id="account" hidden>
    <span class="badge" id="account-mode"></span>
    <span class="account-money">
      equity <b id="account-equity">—</b> · свободно <b id="account-available">—</b>
    </span>
    <span class="account-note" id="account-note" hidden></span>
  </header>

  <main>
    <section class="screen" id="screen-loading">
      <p class="muted">Загрузка…</p>
    </section>

    <section class="screen" id="screen-market" hidden>
      <p class="muted">Экран рынка — подэтап 2.3.</p>
    </section>

    <section class="screen" id="screen-trade" hidden>
      <p class="muted">Форма сделки — подэтап 2.4.</p>
    </section>

    <section class="screen" id="screen-confirm" hidden>
      <p class="muted">Подтверждение — подэтап 2.5.</p>
    </section>

    <section class="screen" id="screen-error" hidden>
      <h1 class="error-title" id="error-title"></h1>
      <p id="error-text"></p>
      <button type="button" class="button" id="error-retry">Повторить</button>
    </section>
  </main>

  <nav class="fallback-buttons" id="fallback-buttons" hidden>
    <button type="button" class="button button-long" id="fallback-main"></button>
    <button type="button" class="button button-short" id="fallback-secondary"></button>
  </nav>

  <footer class="attribution">
    <a id="tv-attribution" href="https://www.tradingview.com/" target="_blank"
       rel="noopener noreferrer">Графики — TradingView Lightweight Charts</a>
  </footer>
</body>
</html>
